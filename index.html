<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfume Inventory Organizer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f0f;color:#fff;padding:20px}
h1{margin-bottom:16px}
.topbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;align-items:center}
button,input,select{padding:10px;border-radius:10px;border:1px solid #333;background:#1c1c1c;color:#fff}
button{cursor:pointer}button:hover{background:#2a2a2a}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:#171717;padding:16px;border-radius:14px;border:1px solid #2c2c2c}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.column{background:#161616;border:1px solid #2b2b2b;border-radius:16px;padding:12px;min-height:600px}
.column h2{text-align:center;margin-bottom:12px}
.dropzone{min-height:550px}
.card{background:#222;border:1px solid #444;border-radius:14px;padding:10px;margin-bottom:12px;cursor:grab}
.card img{width:100%;height:180px;object-fit:cover;border-radius:10px;margin-bottom:10px;background:#333}
.card input,.card select{width:100%;margin-bottom:8px}
.card.dragging{opacity:.5}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stock-ok{border-left:5px solid #16a34a}
.stock-low{border-left:5px solid #f59e0b}
.stock-out{border-left:5px solid #dc2626}
.card-label{display:block;font-size:11px;color:#888;margin-bottom:3px;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
textarea{width:100%;margin-top:20px;min-height:180px;background:#111;color:#fff;border:1px solid #333;border-radius:12px;padding:12px}
@media(max-width:1200px){.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.board,.stats{grid-template-columns:1fr}}

/* Sync bar */
.sync-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px;padding:10px 14px;background:#161616;border:1px solid #2b2b2b;border-radius:12px}
.btn-push{background:#1a3a6e!important;border-color:#2a5aae!important;color:#7eb8f7!important}
.btn-push:hover{background:#22487a!important}
.btn-pull{background:#1a3a2a!important;border-color:#2a6a3a!important;color:#6fcf97!important}
.btn-pull:hover{background:#1e4a32!important}
.btn-restore{background:#3a2a1a!important;border-color:#8a5a2a!important;color:#f7c97e!important}
.btn-restore:hover{background:#4a3a1a!important}
.btn-cfg{background:#2a1a3a!important;border-color:#5a2a8a!important;color:#c97ef7!important}
#syncStatus{font-size:13px;font-weight:bold}
#syncStatus.loading{color:#f59e0b}
#syncStatus.ok{color:#16a34a}
#syncStatus.error{color:#dc2626}

/* Login screen */
#loginScreen{position:fixed;inset:0;background:#0a0a0a;z-index:99999;display:flex;align-items:center;justify-content:center}
.login-box{background:#181818;border:1px solid #333;border-radius:24px;padding:40px;max-width:380px;width:90%;text-align:center}
.login-box h2{font-size:24px;margin-bottom:6px}
.login-box p{color:#666;font-size:13px;margin-bottom:24px}
#loginInput{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;font-size:16px;text-align:center;letter-spacing:3px;margin-bottom:12px}
#loginBtn{width:100%;padding:14px;border-radius:12px;border:none;background:#1a4fa8;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
#loginBtn:hover{background:#1e5cbd}
#loginError{color:#dc2626;font-size:13px;margin-top:10px;min-height:18px}

</style>
</head>
<body>

<!-- ═══════ LOGIN SCREEN ═══════ -->
<div id="loginScreen">
  <div class="login-box">
    <h2>🔒 Perfume Inventory</h2>
    <p>Enter your access code to continue</p>
    <input id="loginInput" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')tryLogin()">
    <button id="loginBtn" onclick="tryLogin()">Enter</button>
    <div id="loginError"></div>
  </div>
</div>


<!-- ═══════ MAIN APP ═══════ -->
<h1>Perfume Inventory Organizer</h1>

<div class="topbar">
  <input type="file" id="imageUpload" multiple accept="image/*">
  <button onclick="loadAllProducts()" style="background:#1a3020!important;border-color:#2d6040!important;color:#5ddb8a!important;font-weight:bold">📦 Load All 89 Products</button>
  <input type="text" id="search" placeholder="Search perfume...">
  <button onclick="undoAction()">Undo</button>
  <button onclick="redoAction()">Redo</button>
  <button onclick="exportCSV()">Export CSV</button>
  <button onclick="exportTXT()">Export TXT</button>
</div>

<div class="sync-bar">
  <button class="btn-push"    onclick="pushToCloud()">☁️ Push to Cloud</button>
  <button class="btn-pull"    onclick="pullFromCloud()">⬇️ Pull from Cloud</button>
  <button class="btn-restore" onclick="restorePrevious()">↩️ Restore Previous</button>
  <span id="syncStatus"></span>
</div>

<div class="stats">
  <div class="stat"><h3>Total Products</h3><p id="totalProducts">0</p></div>
  <div class="stat"><h3>Total Inventory</h3><p id="totalInventory">0</p></div>
  <div class="stat"><h3>Potential Revenue</h3><p id="totalRevenue">0 DH</p></div>
</div>

<div class="board">
  <div class="column"><h2>All Products</h2><div class="dropzone" id="all"></div></div>
  <div class="column"><h2>Homme</h2><div class="dropzone" id="homme"></div></div>
  <div class="column"><h2>Femme</h2><div class="dropzone" id="femme"></div></div>
  <div class="column"><h2>Mixte</h2><div class="dropzone" id="mixte"></div></div>
</div>

<textarea id="exportBox" placeholder="Export preview..."></textarea>

<script>
// ═══════ LOGIN ═══════
const CODES = { 'amrani2026': 'owner', 'imad2026': 'friend' };

function tryLogin() {
  const val = document.getElementById('loginInput').value.trim();
  if (CODES[val]) {
    localStorage.setItem('prf_session', val);
    document.getElementById('loginScreen').style.display = 'none';
    startApp();
  } else {
    document.getElementById('loginError').textContent = 'Wrong code. Try again.';
    document.getElementById('loginInput').value = '';
    document.getElementById('loginInput').focus();
  }
}

// ═══════ HARDCODED REPO (public — no token needed to read) ═══════
const GH_OWNER = 'AmraniHub';
const GH_REPO  = 'perfume-inventory';
const GH_RAW   = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/main`;
const GH_API   = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents`;
const COLUMNS  = ['all','homme','femme','mixte'];

let ghToken = '';
const TOKEN_URL = 'https://gist.githubusercontent.com/AmraniHub/6adc784a083af28892120afa66a7f099/raw/key.txt';
const TOKEN_KEY = 'prf26';

function decodeToken(enc) {
  const raw = atob(enc);
  return raw.split('').map((c,i) => String.fromCharCode(c.charCodeAt(0) ^ TOKEN_KEY.charCodeAt(i % TOKEN_KEY.length))).join('');
}

async function loadToken() {
  try {
    const r = await fetch(TOKEN_URL + '?t=' + Date.now());
    if (r.ok) ghToken = decodeToken((await r.text()).trim());
  } catch(e) { console.warn('Token load failed:', e.message); }
}


// ═══════ STATUS ═══════
function setSyncStatus(msg, state) {
  const el = document.getElementById('syncStatus');
  el.textContent = msg;
  el.className = state || '';
  if (state === 'ok') setTimeout(() => { el.textContent = ''; el.className = ''; }, 5000);
}

// ═══════ UNIQUE IDS ═══════
function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
}

// ═══════ GITHUB HELPERS ═══════
function authHeaders() {
  const h = { 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
  if (ghToken) h['Authorization'] = 'token ' + ghToken;
  return h;
}

async function ghGetFile(path) {
  const r = await fetch(`${GH_API}/${path}`, { headers: authHeaders() });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('GitHub read error ' + r.status);
  return await r.json();
}

async function ghPutFile(path, base64Content, sha) {
  const body = { message: 'Update ' + path, content: base64Content };
  if (sha) body.sha = sha;
  const r = await fetch(`${GH_API}/${path}`, {
    method: 'PUT',
    headers: authHeaders(),
    body: JSON.stringify(body)
  });
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    throw new Error(err.message || 'GitHub write error ' + r.status);
  }
  return await r.json();
}

async function uploadImage(base64DataUrl, cardId) {
  const path = 'images/' + cardId + '.jpg';
  const rawBase64 = base64DataUrl.split(',')[1];
  const existing = await ghGetFile(path);
  await ghPutFile(path, rawBase64, existing ? existing.sha : undefined);
  // Return the raw URL — no token needed to load images from public repo
  return `${GH_RAW}/${path}?t=${Date.now()}`;
}

// ═══════ PUSH TO CLOUD ═══════
async function pushToCloud() {
  if (!ghToken) { setSyncStatus('Loading credentials... try again in a second.', 'error'); loadToken(); return; }

  const cards = document.querySelectorAll('.card');
  if (!cards.length) { setSyncStatus('No products to push.', 'error'); return; }

  setSyncStatus('Uploading 0/' + cards.length + '...', 'loading');
  const inventory = {};
  let done = 0;

  for (const card of cards) {
    if (!card.dataset.id) card.dataset.id = generateId();
    const id = card.dataset.id;
    let imageUrl = card.querySelector('img').src;

    if (imageUrl.startsWith('data:')) {
      try {
        imageUrl = await uploadImage(imageUrl, id);
        card.querySelector('img').src = imageUrl;
      } catch(e) {
        console.warn('Image upload failed:', id, e.message);
      }
    }

    inventory[id] = {
      name:     card.querySelector('.name').value  || '',
      qty:      card.querySelector('.qty').value   || '0',
      price:    card.querySelector('.price').value || '0',
      status:   card.querySelector('.status').value,
      column:   card.closest('.dropzone').id || 'all',
      imageUrl: imageUrl
    };

    done++;
    setSyncStatus('Uploading ' + done + '/' + cards.length + '...', 'loading');
  }

  try {
    // Backup current cloud data before overwriting
    const existing = await ghGetFile('data.json');
    if (existing) {
      const backupExisting = await ghGetFile('data_backup.json');
      await ghPutFile('data_backup.json', existing.content.replace(/\n/g,''), backupExisting ? backupExisting.sha : undefined);
    }

    const jsonStr    = JSON.stringify(inventory, null, 2);
    const b64Content = btoa(unescape(encodeURIComponent(jsonStr)));
    await ghPutFile('data.json', b64Content, existing ? existing.sha : undefined);
    autoSave();
    setSyncStatus('All ' + done + ' products saved to cloud ✓', 'ok');
  } catch(e) {
    setSyncStatus('Save failed: ' + e.message, 'error');
  }
}

// ═══════ LOAD ALL 89 PRODUCTS FROM GITHUB ═══════
async function loadAllProducts() {
  if (!confirm('This will clear current cards and load all 89 products fresh. Continue?')) return;
  document.querySelectorAll('.dropzone').forEach(z => z.innerHTML = '');
  setSyncStatus('Loading products...', 'loading');
  try {
    // Fetch the products list from raw URL — no token needed
    const r = await fetch(`${GH_RAW}/products.json?t=${Date.now()}`);
    if (!r.ok) throw new Error('products.json not found (status ' + r.status + ')');
    const files = await r.json();

    let done = 0;
    for (const filename of files) {
      const imageUrl = `${GH_RAW}/products/${encodeURIComponent(filename)}`;
      const name = filename
        .replace(/\.[^/.]+$/, '')
        .replace(/-/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase());
      createCard(imageUrl, name, 'all', 0, 0, generateId());
      done++;
    }
    updateStats();
    autoSave();
    setSyncStatus('Loaded ' + done + ' products ✓ — now set prices and push!', 'ok');
  } catch(e) {
    setSyncStatus('Load failed: ' + e.message, 'error');
  }
}

// ═══════ RESTORE PREVIOUS ═══════
async function restorePrevious() {
  if (!ghToken) { setSyncStatus('Loading credentials... try again in a second.', 'error'); loadToken(); return; }
  if (!confirm('Restore the previous version from cloud? Current data will be replaced.')) return;
  setSyncStatus('Restoring previous version...', 'loading');
  try {
    const file = await ghGetFile('data_backup.json');
    if (!file) { setSyncStatus('No backup found — push at least once first.', 'error'); return; }
    const json = decodeURIComponent(escape(atob(file.content.replace(/\n/g,''))));
    const data = JSON.parse(json);
    document.querySelectorAll('.dropzone').forEach(z => z.innerHTML = '');
    Object.entries(data).forEach(([id, item]) => {
      const col = COLUMNS.includes(item.column) ? item.column : 'all';
      createCard(item.imageUrl, item.name, col, item.qty, item.price, id, item.status);
    });
    updateStats();
    autoSave();
    setSyncStatus('Previous version restored ✓', 'ok');
  } catch(e) {
    setSyncStatus('Restore failed: ' + e.message, 'error');
  }
}

// ═══════ PULL FROM CLOUD ═══════
// Uses raw.githubusercontent.com — no token needed for public repos
async function pullFromCloud(silent=false) {
  if (!silent) setSyncStatus('Loading from cloud...', 'loading');
  try {
    const url = `${GH_RAW}/data.json?t=${Date.now()}`;
    const r = await fetch(url);
    if (!r.ok) {
      if (!silent) setSyncStatus('No cloud data yet — push your products first.', 'error');
      return;
    }
    const data = await r.json();
    if (!data || !Object.keys(data).length) { setSyncStatus('Cloud is empty.', 'error'); return; }

    document.querySelectorAll('.dropzone').forEach(z => z.innerHTML = '');
    Object.entries(data).forEach(([id, item]) => {
      const col = COLUMNS.includes(item.column) ? item.column : 'all';
      createCard(item.imageUrl, item.name, col, item.qty, item.price, id, item.status);
    });

    updateStats();
    autoSave();
    setSyncStatus('Loaded ' + Object.keys(data).length + ' products ✓', 'ok');
  } catch(e) {
    setSyncStatus('Load failed: ' + e.message, 'error');
    loadData();
  }
}

// ═══════ CARD CREATION ═══════
const historyStack = [];
const redoStack    = [];

document.getElementById('imageUpload').addEventListener('change', (e) => {
  Array.from(e.target.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      createCard(ev.target.result, file.name.replace(/\.[^/.]+$/, ''), 'all', 0, 0, generateId());
      saveState();
    };
    reader.readAsDataURL(file);
  });
});

function createCard(src, name, target='all', qty=0, price=0, id=null, statusVal='Available') {
  const card = document.createElement('div');
  card.className = 'card stock-low';
  card.draggable = true;
  card.dataset.id = id || generateId();

  const safe = (s) => String(s || '').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  const sel  = (v, opt) => v === opt ? ' selected' : '';
  const sv   = ['Available','Low Stock','Out of Stock'].includes(statusVal) ? statusVal : 'Available';

  card.innerHTML = `
    <img src="${safe(src)}" loading="lazy">
    <label class="card-label">Perfume Name</label>
    <input type="text"   class="name"  value="${safe(name)}"  placeholder="e.g. Sauvage">
    <label class="card-label">Quantity in Stock</label>
    <input type="number" class="qty"   value="${qty}"         placeholder="0" min="0">
    <label class="card-label">Selling Price (DH)</label>
    <input type="number" class="price" value="${price}"       placeholder="0" min="0">
    <label class="card-label">Status</label>
    <select class="status">
      <option${sel(sv,'Available')}>Available</option>
      <option${sel(sv,'Low Stock')}>Low Stock</option>
      <option${sel(sv,'Out of Stock')}>Out of Stock</option>
    </select>
    <div class="actions">
      <button onclick="downloadImage(this)">Download</button>
      <button onclick="duplicateCard(this)">Duplicate</button>
      <button onclick="deleteCard(this)">Delete</button>
      <button onclick="moveToOrganized(this)">Quick Move</button>
    </div>`;

  addEvents(card);
  updateStockClass(card);
  const zone = document.getElementById(target) || document.getElementById('all');
  zone.appendChild(card);
  updateStats();
  autoSave();
}

function addEvents(card) {
  card.addEventListener('dragstart', () => card.classList.add('dragging'));
  card.addEventListener('dragend',   () => { card.classList.remove('dragging'); autoSave(); saveState(); });
  card.querySelectorAll('input,select').forEach(el => {
    el.addEventListener('input',  () => { updateStockClass(card); updateStats(); autoSave(); });
    el.addEventListener('change', () => saveState());
  });
}

function updateStockClass(card) {
  const qty = parseInt(card.querySelector('.qty').value) || 0;
  card.classList.remove('stock-ok','stock-low','stock-out');
  card.classList.add(qty === 0 ? 'stock-out' : qty <= 10 ? 'stock-low' : 'stock-ok');
}

function moveToOrganized(btn) {
  const card = btn.closest('.card');
  document.getElementById('homme').appendChild(card);
  card.scrollIntoView({ behavior:'smooth', block:'center' });
  autoSave(); saveState();
}

function deleteCard(btn)     { saveState(); btn.closest('.card').remove(); updateStats(); autoSave(); }
function duplicateCard(btn)  {
  const c = btn.closest('.card');
  createCard(c.querySelector('img').src, c.querySelector('.name').value,
    c.closest('.dropzone').id, c.querySelector('.qty').value,
    c.querySelector('.price').value, generateId(), c.querySelector('.status').value);
  saveState();
}
async function downloadImage(btn) {
  const c    = btn.closest('.card');
  const name = (c.querySelector('.name').value || 'perfume').trim();
  const src  = c.querySelector('img').src;
  btn.textContent = '...';
  btn.disabled = true;
  try {
    const resp = await fetch(src);
    const blob = await resp.blob();
    const ext  = blob.type.includes('png') ? '.png' : '.jpg';
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = name + ext;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch(e) {
    // fallback for base64 images
    const a    = document.createElement('a');
    a.href     = src;
    a.download = name + '.jpg';
    a.click();
  } finally {
    btn.textContent = 'Download';
    btn.disabled = false;
  }
}

// ═══════ STATS ═══════
function updateStats() {
  let inv = 0, rev = 0;
  document.querySelectorAll('.card').forEach(c => {
    inv += parseInt(c.querySelector('.qty').value)   || 0;
    rev += (parseInt(c.querySelector('.qty').value) || 0) * (parseInt(c.querySelector('.price').value) || 0);
  });
  document.getElementById('totalProducts').innerText  = document.querySelectorAll('.card').length;
  document.getElementById('totalInventory').innerText = inv;
  document.getElementById('totalRevenue').innerText   = rev + ' DH';
}

// ═══════ DRAG & DROP ═══════
document.querySelectorAll('.dropzone').forEach(zone => {
  zone.addEventListener('dragover', (e) => {
    e.preventDefault();
    const d = document.querySelector('.dragging');
    if (d) zone.appendChild(d);
    if (window.innerHeight - e.clientY < 120) window.scrollBy(0, 20);
    if (e.clientY < 120) window.scrollBy(0, -20);
  });
});

// ═══════ LOCAL STORAGE ═══════
function autoSave() {
  const data = {};
  document.querySelectorAll('.dropzone').forEach(zone => {
    data[zone.id] = [];
    zone.querySelectorAll('.card').forEach(c => {
      data[zone.id].push({ id:c.dataset.id, img:c.querySelector('img').src,
        name:c.querySelector('.name').value, qty:c.querySelector('.qty').value,
        price:c.querySelector('.price').value, status:c.querySelector('.status').value });
    });
  });
  localStorage.setItem('perfume_inventory_data', JSON.stringify(data));
}

function loadData() {
  const saved = JSON.parse(localStorage.getItem('perfume_inventory_data') || 'null');
  if (!saved) return;
  Object.keys(saved).forEach(section => {
    (saved[section] || []).forEach(item => {
      createCard(item.img, item.name, section, item.qty, item.price, item.id, item.status);
    });
  });
  updateStats();
}

// ═══════ UNDO / REDO ═══════
function saveState() {
  const cur = localStorage.getItem('perfume_inventory_data');
  if (historyStack[historyStack.length-1] === cur) return;
  historyStack.push(cur); if (historyStack.length > 50) historyStack.shift();
  redoStack.length = 0;
}
function undoAction() {
  if (historyStack.length < 2) return;
  redoStack.push(historyStack.pop());
  const prev = historyStack[historyStack.length-1]; if (!prev) return;
  localStorage.setItem('perfume_inventory_data', prev); reloadBoard();
}
function redoAction() {
  if (!redoStack.length) return;
  const next = redoStack.pop(); historyStack.push(next);
  localStorage.setItem('perfume_inventory_data', next); reloadBoard();
}
function reloadBoard() {
  document.querySelectorAll('.dropzone').forEach(z => z.innerHTML = '');
  loadData();
}

// ═══════ EXPORT ═══════
function getImageUrl(card) {
  const src = card.querySelector('img').src;
  // If still base64 (not yet pushed), no link available
  if (src.startsWith('data:')) return '(push to cloud first to get link)';
  // Strip cache-busting query param if present
  return src.split('?')[0];
}

function exportCSV() {
  let csv = 'Name,Category,Quantity,Price,Status,Image URL\n';
  document.querySelectorAll('.dropzone').forEach(zone => {
    zone.querySelectorAll('.card').forEach(c => {
      const name   = c.querySelector('.name').value.replace(/"/g,'""');
      const imgUrl = getImageUrl(c);
      csv += `"${name}",${zone.id},${c.querySelector('.qty').value},${c.querySelector('.price').value},${c.querySelector('.status').value},"${imgUrl}"\n`;
    });
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = 'perfume_inventory.csv'; a.click();
  document.getElementById('exportBox').value = csv;
}

function exportTXT() {
  let txt = 'PERFUME INVENTORY\n\n';
  document.querySelectorAll('.dropzone').forEach(zone => {
    txt += '===== ' + zone.id.toUpperCase() + ' =====\n';
    zone.querySelectorAll('.card').forEach(c => {
      const imgUrl = getImageUrl(c);
      txt += `${c.querySelector('.name').value} | Qty:${c.querySelector('.qty').value} | Price:${c.querySelector('.price').value} DH | ${c.querySelector('.status').value}\n`;
      txt += `Image: ${imgUrl}\n\n`;
    });
  });
  document.getElementById('exportBox').value = txt;
}

// ═══════ SEARCH ═══════
document.getElementById('search').addEventListener('input', (e) => {
  const v = e.target.value.toLowerCase();
  document.querySelectorAll('.card').forEach(c => {
    c.style.display = c.querySelector('.name').value.toLowerCase().includes(v) ? 'block' : 'none';
  });
});

// ═══════ INIT ═══════
async function startApp() {
  await loadToken();
  loadData();
  saveState();
  await pullFromCloud(true);
}

window.onload = () => {
  const session = localStorage.getItem('prf_session');
  if (session && CODES[session]) {
    document.getElementById('loginScreen').style.display = 'none';
    startApp();
  } else {
    document.getElementById('loginInput').focus();
  }
};
</script>
